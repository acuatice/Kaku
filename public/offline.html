<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#4b18ad" />
    <title>Sin conexión · nazumo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #4b18ad; color: #1d1b2d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); background: #faf8f2; display: grid; place-items: center; }
      main { width: min(100%, 420px); padding: 32px; border-radius: 32px; background: #4b18ad; color: white; }
      .kana { margin: 0 0 32px; color: #dcff35; font-size: 128px; font-weight: 700; line-height: .8; }
      h1 { margin: 0; font-size: 32px; letter-spacing: -.04em; }
      p { margin: 12px 0 24px; color: rgba(255,255,255,.72); line-height: 1.5; }
      button { min-height: 52px; width: 100%; border: 0; border-radius: 999px; background: #dcff35; color: #1d1b2d; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="kana" lang="ja">あ</p>
      <h1>Estás sin conexión</h1>
      <p>Las pantallas visitadas recientemente pueden seguir disponibles. Recupera la conexión para cargar contenido nuevo.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
